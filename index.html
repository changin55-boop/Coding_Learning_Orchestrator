<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <title>Flowchart Agent</title>
  <style>
    :root {
      --bg-1: #07111f;
      --bg-2: #111c35;
      --panel: rgba(12, 22, 42, 0.78);
      --line: rgba(255, 255, 255, 0.12);
      --text: #f8fafc;
      --muted: #a8b3c7;
      --accent-1: #7c3aed;
      --accent-2: #06b6d4;
      --success: #34d399;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      min-height: 100dvh;
      overflow: hidden;
      font-family: "Segoe UI", "Noto Sans KR", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 10%, rgba(124, 58, 237, 0.34), transparent 32%),
        radial-gradient(circle at 88% 88%, rgba(6, 182, 212, 0.28), transparent 34%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
    }

    .app {
      width: 100%;
      height: 100%;
      padding: clamp(10px, 2vw, 24px);
      display: grid;
      place-items: center;
    }

    .shell {
      width: min(1500px, 100%);
      height: min(94dvh, 100%);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--panel);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      animation: enter 0.5s ease-out;
    }

    @keyframes enter {
      from { opacity: 0; transform: translateY(12px) scale(0.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    header {
      min-height: 72px;
      padding: 12px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.035);
    }

    .brand, .status { display: flex; align-items: center; }
    .brand { gap: 13px; min-width: 0; }

    .logo {
      width: 44px;
      height: 44px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 14px;
      color: #fff;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      box-shadow: 0 10px 24px rgba(74, 78, 255, 0.32);
    }

    .brand-copy { min-width: 0; }
    h1 { margin: 0; font-size: 17px; line-height: 1.25; }
    .subtitle {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status {
      gap: 8px;
      flex: 0 0 auto;
      padding: 8px 12px;
      border: 1px solid rgba(52, 211, 153, 0.2);
      border-radius: 999px;
      color: #d1fae5;
      background: rgba(52, 211, 153, 0.08);
      font-size: 12px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 12px var(--success);
    }

    main {
      position: relative;
      flex: 1;
      min-height: 0;
      background: #fff;
    }

    iframe {
      position: absolute;
      inset: 0;
      z-index: 2;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    .loader {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: grid;
      place-items: center;
      color: #334155;
      background: #f8fafc;
    }

    .loader-inner { text-align: center; }
    .spinner {
      width: 34px;
      height: 34px;
      margin: 0 auto 12px;
      border: 3px solid #dbe4f0;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 640px) {
      .app { padding: 0; }
      .shell { width: 100%; height: 100dvh; border: 0; border-radius: 0; }
      header { min-height: 64px; padding: 10px 14px; }
      .logo { width: 40px; height: 40px; border-radius: 12px; }
      .subtitle { max-width: 190px; }
      .status span:last-child { display: none; }
      .status { padding: 8px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <section class="shell" aria-label="Flowchart Agent 애플리케이션">
      <header>
        <div class="brand">
          <div class="logo" aria-hidden="true">AI</div>
          <div class="brand-copy">
            <h1>Flowchart Agent</h1>
            <p class="subtitle">Powered by Microsoft Copilot Studio</p>
          </div>
        </div>
        <div class="status" title="서비스 연결 상태">
          <span class="dot" aria-hidden="true"></span>
          <span>Online</span>
        </div>
      </header>

      <main>
        <div class="loader" id="loader" aria-live="polite">
          <div class="loader-inner">
            <div class="spinner" aria-hidden="true"></div>
            <div>AI 에이전트를 불러오는 중입니다...</div>
          </div>
        </div>

        <iframe
          id="copilotFrame"
          title="Microsoft Copilot Studio Flowchart Agent"
          src="https://copilotstudio.microsoft.com/environments/9324e73a-cd4e-e049-b7ba-177af6165e9c/bots/crbf2_flowchart_agent_02_hhukOx/webchat?__version__=2&amp;enableFileAttachment=false&amp;cliAgent=true"
          allow="clipboard-read; clipboard-write; microphone"
          referrerpolicy="strict-origin-when-cross-origin"
          loading="eager">
        </iframe>
      </main>
    </section>
  </div>

  <script>
    const frame = document.getElementById('copilotFrame');
    const loader = document.getElementById('loader');
    frame.addEventListener('load', () => {
      loader.style.display = 'none';
    });
  </script>
</body>
</html>
