<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina Learning Concierge</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f5f7fb;
            overflow: hidden;
        }

        .header {
            height: 72px;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, #60a5fa, #c084fc);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
        }

        .brand-text h1 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .brand-text p {
            font-size: 12px;
            opacity: 0.8;
        }

        .status {
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #22c55e;
        }

        .chat-container {
            height: calc(100vh - 72px);
            padding: 20px;
            background:
                radial-gradient(circle at top right,
                rgba(99,102,241,0.08),
                transparent 35%);
        }

        .chat-frame {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 18px;
            overflow: hidden;
            background: white;
            box-shadow:
                0 10px 40px rgba(15,23,42,0.08),
                0 2px 10px rgba(15,23,42,0.05);
        }
    </style>
</head>

<body>

    <header class="header">
        <div class="brand">
            <div class="logo">L</div>

            <div class="brand-text">
                <h1>Lumina Learning Concierge</h1>
                <p>AI-Powered Enterprise Learning Assistant</p>
            </div>
        </div>

        <div class="status">
            <span class="status-dot"></span>
            <span>Online</span>
        </div>
    </header>

    <main class="chat-container">
        <iframe
            class="chat-frame"
            src="https://copilotstudio.microsoft.com/environments/9324e73a-cd4e-e049-b7ba-177af6165e9c/bots/crbf2_ailearningcoach2_4C7Exf/webchat?__version__=2&enableFileAttachment=false&cliAgent=true">
        </iframe>
    </main>

</body>
</html>
