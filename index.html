<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Assistant</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", sans-serif;
}

body {
    height: 100vh;
    background: linear-gradient(135deg, #0f172a, #1e293b, #334155);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;
}

/* 메인 컨테이너 */
.chat-container {
    width: 100%;
    max-width: 1400px;
    height: 92vh;

    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 24px;

    box-shadow:
        0 10px 40px rgba(0,0,0,0.3),
        inset 0 1px 0 rgba(255,255,255,0.1);

    overflow: hidden;
    display: flex;
    flex-direction: column;
}

/* 상단 헤더 */
.header {
    height: 72px;
    padding: 0 28px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background: rgba(255,255,255,0.05);
    border-bottom: 1px solid rgba(255,255,255,0.08);
}

.logo-section {
    display: flex;
    align-items: center;
    gap: 14px;
}

.logo {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: linear-gradient(135deg,#4f46e5,#06b6d4);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: bold;
}

.title {
    color: white;
}

.title h2 {
    font-size: 18px;
    font-weight: 600;
}

.title p {
    font-size: 12px;
    color: #cbd5e1;
}

/* 상태 표시 */
.status {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #e2e8f0;
    font-size: 14px;
}

.status-dot {
    width: 10px;
    height: 10px;
    border-radius: 99px;
    background: #22c55e;
    box-shadow: 0 0 10px #22c55e;
}

/* iframe 영역 */
.chat-frame {
    flex: 1;
    background: #fff;
}

.chat-frame iframe {
    width: 100%;
    height: 100%;
    border: none;
}
</style>
</head>

<body>

<div class="chat-container">

    <div class="header">
        <div class="logo-section">
            <div class="logo">AI</div>

            <div class="title">
                <h2>Flowchart Agent</h2>
                <p>Powered by Microsoft Copilot Studio</p>
            </div>
        </div>

        <div class="status">
            <span class="status-dot"></span>
            <span>Online</span>
        </div>
    </div>

    <div class="chat-frame">
        https://copilotstudio.microsoft.com/environments/9324e73a-cd4e-e049-b7ba-177af6165e9c/bots/crbf2_flowchart_agent_02_hhukOx/webchat?__version__=2&enableFileAttachment=false&cliAgent=true
        </iframe>
    </div>

</div>

</body>
</html>
