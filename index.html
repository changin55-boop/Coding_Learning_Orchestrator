<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>코딩 학습 오케스트레이터</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
height:100vh;
display:flex;
flex-direction:column;

background:
linear-gradient(
135deg,
#e8f4ff 0%,
#fffde8 50%,
#eefff4 100%
);
}

/* TOP */

.header{

height:90px;

display:flex;
justify-content:space-between;
align-items:center;

padding:0 40px;

backdrop-filter:blur(20px);

background:
rgba(255,255,255,.75);

border-bottom:
1px solid rgba(255,255,255,.3);

box-shadow:
0 4px 20px rgba(0,0,0,.05);
}

.logo{

display:flex;
align-items:center;
gap:15px;

font-size:24px;
font-weight:700;
color:#1f3b70;
}

.logo-icon{

width:50px;
height:50px;

display:flex;
align-items:center;
justify-content:center;

border-radius:15px;

background:
linear-gradient(
135deg,
#4ea1ff,
#42d392
);

color:white;
font-size:24px;
}

.badges{

display:flex;
gap:15px;
}

.badge{

padding:10px 18px;

border-radius:999px;

font-size:14px;
font-weight:600;

background:white;

box-shadow:
0 4px 12px rgba(0,0,0,.07);
}

.level{
color:#2f8f66;
}

.streak{
color:#c78400;
}

/* HERO */

.hero{

padding:25px 40px;
}

.hero-card{

display:flex;
justify-content:space-between;
align-items:center;

background:white;

border-radius:25px;

padding:25px 30px;

box-shadow:
0 10px 30px rgba(0,0,0,.08);
}

.hero-left h2{
font-size:28px;
margin-bottom:6px;
color:#233a66;
}

.hero-left p{
color:#5d728d;
}

.progress{

width:320px;
}

.progress-top{
display:flex;
justify-content:space-between;
margin-bottom:10px;
}

.progress-bar{

height:12px;
border-radius:999px;
overflow:hidden;

background:#edf2f8;
}

.progress-fill{

height:100%;
width:33%;

background:
linear-gradient(
90deg,
#4ea1ff,
#42d392
);
}

/* CHAT */

.chat-area{

flex:1;
padding:0 40px 40px;
}

.chat-card{

height:100%;

border-radius:30px;

overflow:hidden;

background:white;

box-shadow:
0 20px 40px rgba(0,0,0,.08);
}

.chat-header{

height:70px;

display:flex;
align-items:center;

padding:0 25px;

background:
linear-gradient(
90deg,
#4ea1ff,
#42d392
);

color:white;
font-size:18px;
font-weight:600;
}

.chat-header span{
margin-right:10px;
}

.chat-card iframe{

width:100%;
height:calc(100% - 70px);

border:none;
}

</style>
</head>

<body>

<header class="header">

<div class="logo">

<div class="logo-icon">
🤖
</div>

<div>
코딩 학습 오케스트레이터
</div>

</div>

<div class="badges">

<div class="badge level">
🌱 입문 학습자
</div>

<div class="badge streak">
🔥 7일 연속 학습
</div>

</div>

</header>

<section class="hero">

<div class="hero-card">

<div class="hero-left">

<h2>현재 단계 : 공통 문제 생성</h2>

<p>
조건문과 반복문을 배우며 첫 번째 진단 문제를 해결해보세요.
</p>

</div>

<div class="progress">
