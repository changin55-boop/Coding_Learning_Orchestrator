<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Coding Learning Platform</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
height:100vh;
overflow:hidden;

background:
linear-gradient(
135deg,
#e9f4ff 0%,
#fff8d9 50%,
#e9fff0 100%
);
}

.container{
display:flex;
height:100vh;
}

/* =======================
   SIDEBAR
======================= */

.sidebar{
width:320px;

padding:24px;

background:
rgba(255,255,255,0.85);

backdrop-filter:blur(20px);

border-right:
1px solid rgba(255,255,255,.4);
}

.logo{
display:flex;
align-items:center;
gap:12px;

font-size:24px;
font-weight:700;

color:#1e3a5f;

margin-bottom:30px;
}

.logo-icon{

width:50px;
height:50px;

border-radius:16px;

display:flex;
align-items:center;
justify-content:center;

background:
linear-gradient(
135deg,
#3498ff,
#4ade80
);

color:white;
font-size:24px;
}

/* =======================
   LEVEL CARD
======================= */

.level-card{

background:white;

border-radius:24px;

padding:20px;

box-shadow:
0 10px 25px rgba(0,0,0,.06);

margin-bottom:20px;
}

.level-card h3{
margin-bottom:10px;
color:#20344d;
}

.level-badge{

display:inline-block;

padding:8px 14px;

border-radius:999px;

background:#d9fbe5;

color:#13744d;

font-weight:600;

margin-bottom:15px;
}

.progress-bar{

height:12px;

background:#edf1f5;

border-radius:999px;

overflow:hidden;
}

.progress-fill{

width:33%;

height:100%;

background:
linear-gradient(
90deg,
#3498ff,
#4ade80
);
}

/* =======================
   STEPS
======================= */

.steps{
display:flex;
flex-direction:column;
gap:10px;
}

.step{

background:white;

padding:14px;

border-radius:16px;

box-shadow:
0 3px 10px rgba(0,0,0,.04);

transition:.2s;
}

.step:hover{
transform:translateY(-2px);
}

.active{
border-left:6px solid #3498ff;
}

.locked{
opacity:.55;
}

/* =======================
   MAIN
======================= */

.main{
flex:1;
display:flex;
flex-direction:column;

padding:20px;
}

/* HEADER */

.topbar{

height:85px;

background:
rgba(255,255,255,.85);

border-radius:24px;

display:flex;
align-items:center;
justify-content:space-between;

padding:0 30px;

backdrop-filter:blur(20px);

margin-bottom:20px;
}

.title{

font-size:26px;
font-weight:700;
color:#20344d;
}

.sub{

color:#6b7b8e;
font-size:14px;
margin-top:4px;
}

.stats{

display:flex;
gap:12px;
}

.stat{

background:white;

padding:10px 16px;

border-radius:14px;

font-weight:600;

box-shadow:
0 4px 12px rgba(0,0,0,.05);
}

/* CHAT */

.chat-container{

flex:1;

background:white;

border-radius:30px;

overflow:hidden;

box-shadow:
0 15px 35px rgba(0,0,0,.08);
}

.chat-header{

height:70px;

display:flex;
align-items:center;

padding:0 25px;

background:
linear-gradient(
90deg,
#3498ff,
#4ade80
);

color:white;

font-size:18px;
font-weight:600;
}

.chat-header span{
margin-right:10px;
}

iframe{
width:100%;
height:calc(100% - 70px);
border:none;
}

@media(max-width:1000px){

.container{
flex-direction:column;
}

.sidebar{
width:100%;
height:340px;
overflow:auto;
}

}

</style>
</head>

<body>

<div class="container">

<div class="sidebar">

<div class="logo">

<div class="logo-icon">
🤖
</div>

<div>
Coding Journey
</div>

</div>

<div class="level-card">

<h3>학습 현황</h3>

<div class="level-badge">
🌱 입문
</div>

<div style="margin-bottom:10px;">
진행률 33%
</div>

<div class
